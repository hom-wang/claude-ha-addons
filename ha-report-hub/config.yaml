name: HA Report Hub
version: "1.0.0"
slug: ha-report-hub
description: Report hub - browse the weekly and monthly reports, baselines, rules, topology and device inventory generated by claude-ha, behind Home Assistant login (static pages, busybox httpd, Ingress only)
url: https://github.com/hom-wang/claude-ha-addons
arch: [aarch64, amd64, armv7]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:book-open-page-variant
panel_title: Report Hub
panel_admin: true
map:
  - type: homeassistant_config
    read_only: true
